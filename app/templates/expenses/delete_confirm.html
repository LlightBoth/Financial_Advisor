{% extends "layouts/clientBase.html" %}
{% block title %} {{ _('expense.delete_title') }} {% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="h4 text-danger"> {{ _('common.confirm_delete') }} </h3>
        <p class="mt-3"> {{ _('expense.delete_prompt') }} </p>

        <form method="post" action="{{ url_for('expenses.delete', expense_id=expense.id) }}">
            {{ form.hidden_tag() }}
            {{ form.submit(class="btn btn-danger") }}
            <a href="{{ url_for('expenses.index') }}" class="btn btn-secondary"> {{ _('common.cancel') }} </a>
        </form>
        
    </div>
</div>

{% endblock %}
