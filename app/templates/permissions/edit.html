{% extends "layouts/base.html" %}
{% block title %}Edit Permission: {{ permission.code }}{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-sm-4 py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8 col-xl-7">
            
            <div class="d-flex align-items-center gap-2 mb-4">
                <a href="{{ url_for('permissions.index') }}" class="btn btn-outline-secondary btn-sm rounded-3">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </a>
                <h1 class="h4 fw-bold mb-0 text-body">Edit Permission</h1>
            </div>

            <div class="card bg-body border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-body-tertiary border-bottom border-subtle py-3 px-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <i class="bi bi-pencil-square text-primary"></i>
                        <span class="fw-bold text-body">Update Details</span>
                    </div>
                    <code class="px-2 py-1 bg-body border border-subtle rounded-2 text-primary small">{{ permission.code }}</code>
                </div>
                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% include "permissions/_form.html" %}
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
