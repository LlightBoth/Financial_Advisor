<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} — Financial Advisor</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="{{ url_for('static', filename='css/layout/auth.css') }}?v=2.3" rel="stylesheet">
</head>
<body>

    <!-- Floating Theme Toggle Button -->
    <button type="button" class="floating-theme-btn" id="authThemeToggle" aria-label="Toggle Dark/Light Mode" title="Toggle Dark/Light Mode">
        <i class="bi bi-moon-stars-fill" id="authThemeIcon"></i>
    </button>

    <!-- Ambient Mesh Glow -->
    <div class="auth-bg-glow" aria-hidden="true">
        <div class="auth-glow-orb auth-glow-1"></div>
        <div class="auth-glow-orb auth-glow-2"></div>
    </div>

    <!-- Split-Screen Auth Container -->
    <div class="auth-split-layout">
        
        <!-- Left Column: Realistic Editorial Photo Panel -->
        <div class="auth-photo-panel">
            <div class="auth-photo-content">
                <div class="auth-telemetry-chip">
                    <i class="bi bi-shield-lock-fill text-info"></i>
                    <span>AI ADVISORY PLATFORM</span>
                </div>
            </div>
        </div>

        <!-- Right Column: Interactive Form Panel -->
        <div class="auth-form-panel">
            <!-- Brand Logo -->
            <a href="/" class="auth-brand-logo">
                <div class="auth-brand-icon">
                    <i class="bi bi-wallet2"></i>
                </div>
                <span class="auth-brand-text">Financial <span>Advisor</span></span>
            </a>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' and category != 'message' else 'danger' }} auth-alert shadow-sm" role="alert">
                            <i class="bi {% if category == 'success' %}bi-check-circle-fill text-success{% elif category == 'info' %}bi-info-circle-fill text-info{% else %}bi-exclamation-triangle-fill text-danger{% endif %} me-2"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Main Auth Content -->
            {% block auth_content %}{% endblock %}
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function() {
            const html = document.documentElement;
            const themeBtn = document.getElementById('authThemeToggle');
            const themeIcon = document.getElementById('authThemeIcon');

            const savedTheme = localStorage.getItem('theme') || 'dark';
            html.setAttribute('data-bs-theme', savedTheme);
            updateIcon(savedTheme);

            function updateIcon(theme) {
                if (themeIcon) {
                    themeIcon.className = theme === 'dark' ? 'bi bi-sun-fill text-warning' : 'bi bi-moon-stars-fill';
                }
            }

            if (themeBtn) {
                themeBtn.addEventListener('click', function() {
                    const currentTheme = html.getAttribute('data-bs-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    html.setAttribute('data-bs-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                    updateIcon(newTheme);
                });
            }
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
